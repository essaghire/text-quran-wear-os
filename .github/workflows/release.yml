name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TEXTQURAN_UPLOAD_STORE_FILE: ${{ github.workspace }}/release.jks
      TEXTQURAN_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TEXTQURAN_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      TEXTQURAN_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set version name from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build release bundle
        run: gradle bundleRelease --no-daemon

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.essaghir.textquran
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
